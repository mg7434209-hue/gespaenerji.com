name: Deploy to GitHub Pages

# Yalnız canlı dal tetikler: birden çok dala aynı anda push edildiğinde
# concurrency (cancel-in-progress) run'ları birbirine iptal ettiriyor ve
# main run'ı Pages ortam korumasına takılıp "failure" veriyordu — site
# eski sürümde kalıyordu. Tek tetikleyici dal bu kilitlenmeyi bitirir.
on:
  push:
    branches:
      - claude/determined-albattani-ol20qb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek bir yayın çalışsın
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # IndexNow "son commit'te değişen sayfalar" için HEAD~1 gerekir

      - name: Build multilingual pages (/en, /de, /ru)
        run: node build.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Yayından sonra değişen sayfaları Bing/Yandex/Naver'a anında bildir
      # (api.indexnow.org). Bing indeksi Copilot/ChatGPT aramasını besler.
      # Push'un TÜM commit'leri kapsansın diye push öncesi commit (before) de
      # sığ olarak çekilir; iki ağaç arasındaki fark için geçmiş gerekmez.
      # Hata yayını düşürmez.
      - name: IndexNow — değişen sayfaları bildir
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || true; fi
          node tools/indexnow.js --base="$BEFORE"
        continue-on-error: true
